services:
  app:
    image: portal-app:${PORTAL_RELEASE:-local}
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://portal:${PORTAL_DB_PASSWORD:-portal}@db:5432/portal?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      INVITATION_TOKEN_PEPPER: ${INVITATION_TOKEN_PEPPER:?Set INVITATION_TOKEN_PEPPER in .env}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_WORKER_SECRET: ${MAX_WORKER_SECRET:-}
      MAX_LINK_TOKEN_PEPPER: ${MAX_LINK_TOKEN_PEPPER:-}
      UPLOAD_DIR: data/uploads
      MAX_UPLOAD_SIZE_MB: 20
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PORTAL_APP_BIND_ADDRESS:-0.0.0.0}:${PORTAL_APP_HOST_PORT:-3000}:3000"
    volumes:
      - portal_uploads:/app/data/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=1000,gid=1000
    read_only: true
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    image: portal-migrator:${PORTAL_RELEASE:-local}
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://portal:${PORTAL_DB_PASSWORD:-portal}@db:5432/portal?schema=public
      INVITATION_TOKEN_PEPPER: ${INVITATION_TOKEN_PEPPER:?Set INVITATION_TOKEN_PEPPER in .env}
    command: npm run db:setup
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-portal}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - portal_postgres:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  portal_postgres:
  portal_uploads:
