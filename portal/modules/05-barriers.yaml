slug: barriers
version: 1
order: 5
title: Барьеры для развития платформ
description: Системные ограничения, их последствия и практические предложения по устранению.
theory: |
  Барьер — это **устойчивое ограничение**, которое препятствует появлению,
  масштабированию или эффективной работе платформ. Не следует считать
  самостоятельным барьером единичную проблему отдельной организации или
  симптом, не имеющий системной причины.

  **Структурные барьеры** связаны с устройством отрасли: фрагментированностью,
  неоднородностью участников, разобщённостью цепочек создания стоимости,
  закрытостью моделей взаимодействия, концентрацией экономической власти и
  ограниченной конкуренцией.

  **Регуляторные барьеры** включают избыточное или дублирующее регулирование,
  пробелы и коллизии норм, регуляторный арбитраж и требования, предполагающие
  бумажные документы, очное взаимодействие или ручные проверки.

  **Технологические барьеры** возникают из-за недостаточной инфраструктуры,
  низкой доступности и качества данных, несовместимости систем, невысокой
  цифровой зрелости участников и платформ, слабых механизмов доверенного
  взаимодействия, технологической зависимости и киберрисков.

  К **иным барьерам** относятся финансовые, инвестиционные, кадровые и другие
  значимые ограничения. Для каждого барьера отделите причину от последствий,
  свяжите его с наблюдениями предыдущих разделов и предложите практически
  реализуемый способ устранения с понятным ожидаемым результатом.

  В этом разделе оценивается текущее состояние и способы устранения барьеров.
  Итоговые приоритеты и целевая модель до 2036 года будут сформированы в
  разделе 8 на основе всего проведённого анализа.
questions:
  - key: barriers
    order: 1
    type: table
    title: Реестр барьеров
    description: "Добавьте только системные барьеры. Одна карточка — одно конкретное ограничение с причиной, последствиями и предложением. Расположите карточки по значимости: наиболее важные — выше."
    required: true
    config:
      minRows: 1
      maxRows: 15
      sortableRows: true
      numberRows: true
      rowLabel: Барьер
      addRowLabel: Добавить барьер
      columns:
        - key: category
          title: Категория барьера
          description: "Выберите категорию по классификации методики."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Структурный, label: Структурный }
            - { value: Регуляторный, label: Регуляторный }
            - { value: Технологический, label: Технологический }
            - { value: Иной, label: "Иной: финансовый, кадровый или другой" }
        - key: structuralType
          title: Тип структурного барьера
          description: "Выберите наиболее близкий тип из методики или впишите свой вариант."
          type: suggest
          allowCustom: true
          visibleWhen: { columnKey: category, equals: Структурный }
          requiredWhen: { columnKey: category, equals: Структурный }
          fullWidth: true
          options:
            - { value: Фрагментированность отрасли, label: Фрагментированность отрасли }
            - { value: Неоднородность участников отрасли, label: Неоднородность участников отрасли }
            - { value: Разобщённость цепочек создания стоимости, label: Разобщённость цепочек создания стоимости }
            - { value: Недостаточная зрелость отраслевых цепочек взаимодействия, label: Недостаточная зрелость отраслевых цепочек взаимодействия }
            - { value: Закрытость существующих моделей взаимодействия, label: Закрытость существующих моделей взаимодействия }
            - { value: Концентрация экономической власти и ограниченная конкуренция, label: Концентрация экономической власти и ограниченная конкуренция }
        - key: regulatoryType
          title: Тип регуляторного барьера
          description: "Выберите наиболее близкий тип из методики или впишите свой вариант."
          type: suggest
          allowCustom: true
          visibleWhen: { columnKey: category, equals: Регуляторный }
          requiredWhen: { columnKey: category, equals: Регуляторный }
          fullWidth: true
          options:
            - { value: Избыточное регулирование, label: Избыточное регулирование }
            - { value: Дублирующее регулирование, label: Дублирующее регулирование }
            - { value: Пробел регулирования, label: Пробел регулирования }
            - { value: Регуляторный арбитраж, label: Регуляторный арбитраж }
            - { value: Коллизия регулирования, label: Коллизия регулирования }
            - { value: Низкая цифровая зрелость регуляторной среды, label: Низкая цифровая зрелость регуляторной среды }
