          type: suggest
          allowCustom: true
          visibleWhen: { columnKey: category, equals: Технологический }
          requiredWhen: { columnKey: category, equals: Технологический }
          fullWidth: true
          options:
            - { value: Недостаточный уровень развития цифровой инфраструктуры, label: Недостаточный уровень развития цифровой инфраструктуры }
            - { value: Низкая доступность и качество данных, label: Низкая доступность и качество данных }
            - { value: Недостаточная интероперабельность систем, label: Недостаточная интероперабельность систем }
            - { value: Низкая цифровая зрелость участников отрасли, label: Низкая цифровая зрелость участников отрасли }
            - { value: Ограниченная зрелость платформ в отрасли, label: Ограниченная зрелость платформ в отрасли }
            - { value: Недостаточная зрелость механизмов доверенного взаимодействия, label: Недостаточная зрелость механизмов доверенного взаимодействия }
            - { value: Технологическая зависимость, label: Технологическая зависимость }
            - { value: Киберриски и уязвимости, label: Киберриски и уязвимости }
        - key: otherType
          title: Тип иного барьера
          description: "Выберите финансовый или кадровый тип либо впишите свой вариант."
