            - { value: Региональные органы государственной власти, label: Региональные органы государственной власти }
            - { value: Операторы платформ, label: Операторы платформ }
            - { value: Отраслевые объединения, label: Отраслевые объединения }
            - { value: Владельцы и операторы данных, label: Владельцы и операторы данных }
            - { value: Технологические компании, label: Технологические компании }
