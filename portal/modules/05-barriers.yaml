          description: "Сформулируйте кратко и предметно. Например: «Отсутствие единого стандарта измерения аудитории видеоплатформ»."
          type: short_text
          required: true
          uniqueAcrossRows: true
          fullWidth: true
        - key: platforms
          title: Затронутые платформы
          description: "Необязательно. Выберите конкретные платформы из принятого раздела 3. Оставьте поле пустым, если барьер относится ко всей отрасли."
          type: multi_suggest
          contextKey: acceptedPlatforms
          allowCustom: false
          fullWidth: true
          sortOptions: true
        - key: macros
          title: Затронутые макротранзакции
          description: "Необязательно. Выберите сценарии из принятого раздела 2."
          type: multi_suggest
          contextKey: macroTransactions
          allowCustom: false
          fullWidth: true
          sortOptions: true
        - key: participants
          title: Затронутые участники
          description: "Необязательно. Выберите группы из принятых разделов или впишите обобщённую группу."
          type: multi_suggest
          contextKey: industryParticipants
          allowCustom: true
          fullWidth: true
          sortOptions: true
        - key: priorEvidence
          title: Связанные наблюдения из предыдущих разделов
          description: "Необязательно. Выберите уже выявленные источники издержек или ограничения либо впишите собственное наблюдение."
