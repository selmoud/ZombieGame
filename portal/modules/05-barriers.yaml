          contextKey: priorConstraints
          allowCustom: true
          fullWidth: true
          sortOptions: true
        - key: description
          title: Суть и причина барьера
          description: "Опишите устойчивую причину ограничения. Не повторяйте последствия и не ограничивайтесь общим утверждением о нехватке ресурсов."
