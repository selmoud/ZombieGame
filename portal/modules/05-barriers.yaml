            - { value: Недостаток финансирования или инвестиций, label: Недостаток финансирования или инвестиций }
            - { value: Дефицит кадров, label: Дефицит кадров }
            - { value: Недостаток необходимых компетенций, label: Недостаток необходимых компетенций }
        - key: name
