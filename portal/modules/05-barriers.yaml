slug: barriers
version: 1
order: 5
title: Барьеры для развития платформ
description: Системные препятствия и практические способы их устранения.
theory: |
  Барьер — это устойчивое ограничение, которое мешает появлению,
  масштабированию или эффективной работе платформ. Важно отделять причину от
  её симптомов и подтверждать барьер конкретным примером.

  **Структурные барьеры** связаны с устройством рынка: концентрацией,
  фрагментацией, закрытыми цепочками, слабой конкуренцией или отсутствием
  стимулов к кооперации.

  **Регуляторные барьеры** включают избыточные и дублирующие требования,
  пробелы и коллизии регулирования, регуляторный арбитраж и процедуры,
  рассчитанные на бумажное или ручное взаимодействие.

  **Технологические барьеры** возникают из-за недостаточной инфраструктуры,
  низкого качества и доступности данных, несовместимости систем, слабой
  цифровой зрелости участников, киберрисков и технологической зависимости.

  Дополнительно учитывайте финансовые, кадровые и иные ограничения. Для каждого
  барьера укажите затронутые стороны, последствия и конкретное предложение по
  устранению с распределением ролей государства и бизнеса.
questions:
  - key: barriers
    type: table
    title: Карточки барьеров
    required: true
    config:
      minRows: 1
      columns:
        - { key: name, title: Название, type: short_text, required: true }
        - key: kind
          title: Тип
          type: select
          required: true
          options:
            - { value: structural, label: Структурный }
            - { value: regulatory, label: Регуляторный }
            - { value: technology, label: Технологический }
            - { value: financial, label: Финансовый }
            - { value: people, label: Кадровый }
        - { key: description, title: Описание, type: long_text, required: true }
        - { key: affected, title: Кого затрагивает, type: long_text }
        - { key: consequences, title: Последствия, type: long_text }
        - { key: example, title: Пример, type: long_text }
        - { key: solution, title: Предложение по устранению, type: long_text, required: true }
        - { key: state_role, title: Роль государства, type: long_text }
        - { key: business_role, title: Роль бизнеса, type: long_text }
  - key: target_2036
