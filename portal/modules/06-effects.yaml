slug: effects
version: 1
order: 6
title: Эффекты платформизации отрасли
description: Экономические, социальные и бюджетные эффекты платформизации.
theory: |
  Эффект платформизации — это изменение, которое возникает благодаря
  организации взаимодействия через платформы. Не смешивайте эффект с
  мероприятием: запуск API, изменение нормы или создание сервиса — это
  действие, а сокращение издержек, рост доступности или расширение налоговой
  базы — эффект.

  **Экономические эффекты** включают снижение транзакционных издержек, рост
  производительности и повышение эффективности использования ресурсов и
  основных фондов.

  **Социальные эффекты** могут проявляться в занятости и доходах, доступности
  товаров и услуг, потребительском благосостоянии, территориальной
  доступности, инклюзии и снижении барьеров входа для малых участников и
  отдельных групп населения.

  **Бюджетные эффекты** связаны с расширением налоговой базы, ростом налоговых
  поступлений и снижением расходов государства на администрирование и контроль
  благодаря использованию данных платформ.

  Сначала определите, является эффект уже наблюдаемым или пока потенциальным.
  Затем объясните механизм его возникновения и оцените масштаб. Количественные
  значения указывайте только при наличии достаточного основания. Если точных
  данных нет, используйте аргументированную качественную оценку и прямо
  обозначьте её основу.

  Целевые значения до 2036 года в этом разделе не задаются. Они будут
  сформированы в итоговом разделе после сопоставления эффектов, барьеров и
  условий реализации.
questions:
  - key: effects
    order: 1
    type: table
    title: Реестр эффектов платформизации
    description: "Добавьте наиболее значимые эффекты и расположите их по приоритету. Необходимо описать минимум по одному экономическому, социальному и бюджетному эффекту."
    required: true
    config:
      minRows: 3
      maxRows: 15
      sortableRows: true
      numberRows: true
      rowLabel: Эффект
      addRowLabel: Добавить эффект
      requiredColumnValues:
        columnKey: category
        values: [Экономический, Социальный, Бюджетный]
        error: "Добавьте минимум по одному экономическому, социальному и бюджетному эффекту"
      columns:
        - key: category
          title: Категория эффекта
          description: "Выберите категорию по классификации методики."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Экономический, label: Экономический }
            - { value: Социальный, label: Социальный }
            - { value: Бюджетный, label: Бюджетный }
        - key: economicType
          title: Тип экономического эффекта
          description: "Выберите из методики или впишите отраслевой вариант."
          type: suggest
          allowCustom: true
          visibleWhen: { columnKey: category, equals: Экономический }
          requiredWhen: { columnKey: category, equals: Экономический }
          fullWidth: true
          options:
            - { value: Снижение транзакционных издержек, label: Снижение транзакционных издержек }
            - { value: Рост производительности, label: Рост производительности }
            - { value: Повышение эффективности использования ресурсов и основных фондов, label: Повышение эффективности использования ресурсов и основных фондов }
        - key: socialType
          title: Тип социального эффекта
          description: "Выберите из методики или впишите отраслевой вариант."
          type: suggest
          allowCustom: true
          visibleWhen: { columnKey: category, equals: Социальный }
          requiredWhen: { columnKey: category, equals: Социальный }
          fullWidth: true
          options:
            - { value: Занятость и доходы, label: Занятость и доходы }
            - { value: Доступность товаров и услуг, label: Доступность товаров и услуг }
            - { value: Потребительское благосостояние, label: Потребительское благосостояние }
            - { value: Инклюзия и снижение барьеров входа, label: Инклюзия и снижение барьеров входа }
            - { value: Иные показатели социальной динамики, label: Иные показатели социальной динамики }
        - key: budgetType
          title: Тип бюджетного эффекта
          description: "Выберите из методики или впишите отраслевой вариант."
          type: suggest
          allowCustom: true
          visibleWhen: { columnKey: category, equals: Бюджетный }
          requiredWhen: { columnKey: category, equals: Бюджетный }
          fullWidth: true
          options:
            - { value: Расширение налоговой базы, label: Расширение налоговой базы }
            - { value: Рост налоговых поступлений, label: Рост налоговых поступлений }
            - { value: Экономия на государственном администрировании и контроле, label: Экономия на государственном администрировании и контроле }
        - key: name
          title: Формулировка конкретного эффекта
          description: "Сформулируйте наблюдаемое изменение. Например: «Сокращение времени поиска рекламной площадки и согласования размещения»."
          type: short_text
          required: true
          uniqueAcrossRows: true
          fullWidth: true
        - key: relatedMetrics
          title: Связанные ключевые показатели отрасли
          description: "Необязательно. Выберите показатели, которые эксперт определил в разделе 1 как фокус дальнейшего анализа."
          type: multi_suggest
          contextKey: keyMetrics
          allowCustom: false
          fullWidth: true
          sortOptions: true
        - key: platforms
          title: Связанные платформы
          description: "Необязательно. Выберите платформы из принятого раздела 3. Оставьте поле пустым, если эффект относится ко всей отрасли."
          type: multi_suggest
          contextKey: acceptedPlatforms
          allowCustom: false
          fullWidth: true
          sortOptions: true
        - key: macros
          title: Связанные макротранзакции
          description: "Необязательно. Выберите сценарии из принятого раздела 2, в которых возникает эффект."
          type: multi_suggest
          contextKey: macroTransactions
          allowCustom: false
          fullWidth: true
          sortOptions: true
        - key: participants
          title: Для кого возникает эффект
          description: "Выберите группы участников из принятых разделов или впишите обобщённую группу."
          type: multi_suggest
          contextKey: industryParticipants
          allowCustom: true
          required: true
          fullWidth: true
          sortOptions: true
        - key: relatedBarriers
          title: Связанные барьеры
          description: "Необязательно. Выберите барьеры из принятого раздела 5, снятие которых необходимо для реализации эффекта."
          type: multi_suggest
          contextKey: acceptedBarriers
          allowCustom: false
          fullWidth: true
          sortOptions: true
        - key: status
          title: Статус эффекта
          description: "Укажите, наблюдается ли эффект сейчас или может возникнуть при дальнейшем развитии платформ."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Уже наблюдается, label: Уже наблюдается }
            - { value: Начинает проявляться, label: Начинает проявляться }
            - { value: Потенциальный — зависит от масштабирования или снятия барьеров, label: Потенциальный — зависит от масштабирования или снятия барьеров }
            - { value: Негативный или непреднамеренный эффект, label: Негативный или непреднамеренный эффект }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: scale
          title: Экспертная оценка масштаба
          description: "Оцените значимость изменения для отрасли или затронутых групп."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Очень высокий, label: Очень высокий }
            - { value: Высокий, label: Высокий }
            - { value: Средний, label: Средний }
            - { value: Низкий, label: Низкий }
            - { value: Очень низкий, label: Очень низкий }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: mechanism
          title: Механизм возникновения эффекта
          description: "Объясните причинную связь: какое свойство платформенной модели приводит к указанному изменению."
          type: long_text
          required: true
          fullWidth: true
        - key: assessmentFormat
          title: Формат оценки
          description: "Выберите формат, соответствующий доступным данным."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Количественная оценка, label: Количественная оценка }
            - { value: Качественная оценка на основе данных или исследований, label: Качественная оценка на основе данных или исследований }
            - { value: Экспертная качественная оценка, label: Экспертная качественная оценка }
            - { value: Недостаточно данных для оценки, label: Недостаточно данных для оценки }
        - key: quantitativeEstimate
          title: Количественная оценка
          description: "Укажите показатель, исходное значение или базу сравнения, величину изменения, период и единицу измерения."
          type: long_text
          visibleWhen: { columnKey: assessmentFormat, equals: Количественная оценка }
          requiredWhen: { columnKey: assessmentFormat, equals: Количественная оценка }
          fullWidth: true
        - key: basis
          title: Основание оценки
          description: "Выберите основное основание. Подробности можно указать в обосновании или приложить отдельным файлом."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Официальная статистика, label: Официальная статистика }
            - { value: Отраслевое исследование, label: Отраслевое исследование }
            - { value: Данные компании или платформы, label: Данные компании или платформы }
            - { value: Сопоставление с аналогичным опытом, label: Сопоставление с аналогичным опытом }
            - { value: Экспертная оценка, label: Экспертная оценка }
            - { value: Смешанное основание, label: Смешанное основание }
            - { value: Данных недостаточно, label: Данных недостаточно }
        - key: rationale
          title: Обоснование оценки
          description: "Поясните логику оценки и доступные наблюдения. Не представляйте экспертное предположение как подтверждённый факт."
          type: long_text
          required: true
          fullWidth: true
        - key: conditions
          title: Условия реализации потенциального эффекта
          description: "Укажите, какие барьеры, масштаб или изменения должны быть достигнуты, чтобы эффект проявился."
          type: long_text
          visibleWhen: { columnKey: status, equals: Потенциальный — зависит от масштабирования или снятия барьеров }
          requiredWhen: { columnKey: status, equals: Потенциальный — зависит от масштабирования или снятия барьеров }
          fullWidth: true

  - key: effect_materials
    order: 2
    type: file
    title: Подтверждающие материалы
    description: "Необязательно. Приложите расчёт, статистику, исследование или иной материал, подтверждающий оценку эффектов."
    config: {}
