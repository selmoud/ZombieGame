slug: effects
version: 1
order: 6
title: Эффекты платформизации отрасли
description: Измеримые экономические, социальные и бюджетные эффекты.
theory: |
  Эффект платформизации должен быть сформулирован так, чтобы его можно было
  проверить: укажите исходное значение, целевой показатель, период, источник
  данных и метод расчёта.

  **Экономические эффекты** могут включать снижение транзакционных издержек,
  рост производительности, повышение загрузки мощностей и эффективности
  использования ресурсов.

  **Социальные эффекты** охватывают занятость и доходы, доступность товаров и
  услуг, потребительское благосостояние, территориальную доступность и
  вовлечение групп, для которых ранее существовали барьеры входа.

  **Бюджетные эффекты** связаны с расширением налоговой базы, ростом
  поступлений и снижением расходов на администрирование и контроль благодаря
  данным платформ.

  Не смешивайте результат внедрения с самим мероприятием. Например, запуск API
  — это действие, а сокращение срока оформления сделки с пяти дней до одного —
  измеримый эффект.
questions:
  - key: effects
    type: table
    title: Эффекты платформизации
    required: true
    config:
      minRows: 1
      columns:
        - { key: effect, title: Эффект, type: short_text, required: true }
        - key: kind
          title: Тип
          type: select
          required: true
          options:
            - { value: economic, label: Экономический }
            - { value: social, label: Социальный }
            - { value: budget, label: Бюджетный }
        - { key: description, title: Описание, type: long_text }
        - { key: current, title: Текущий показатель, type: short_text, required: true }
        - { key: target, title: Целевой показатель 2036, type: short_text, required: true }
        - { key: source, title: Источник данных, type: link }
        - { key: method, title: Метод оценки, type: long_text }
  - key: assumptions
    type: long_text
    title: Какие допущения лежат в основе оценки?
    required: true
