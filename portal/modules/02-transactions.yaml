slug: transactions
version: 1
order: 2
title: Модель транзакций
description: Участники, сценарии и потенциал платформизации взаимодействий.
theory: |
  Цифровая платформа создаёт ценность, организуя транзакции между двумя или
  более взаимозависимыми группами пользователей. Транзакция — это совокупность
  действий, с помощью которых стороны обмениваются товарами, услугами, данными,
  денежными средствами или другими ценностями.

  Сначала выделите устойчивые группы участников: **стороны спроса и
  предложения**, **посредников** и **государство**. Затем определите
  макротранзакции — устойчивые отраслевые сценарии взаимодействия, например
  заказ и получение услуги.

  Каждую макротранзакцию разложите на микротранзакции: поиск информации,
  идентификацию, проверку требований, согласование решения, оформление
  документов, расчёты и контроль исполнения. Объединение однотипных
  микротранзакций из разных сценариев образует матрицу транзакций отрасли.

  Для сопоставимости оценивайте микротранзакции по трём параметрам:
  **массовость**, **повторяемость** и **стандартизированность**. Чем выше эти
  показатели, тем больше потенциал унификации, цифровизации и перевода
  взаимодействия на платформу.

  Отдельно выявите наиболее ресурсоёмкие операции и источники транзакционных
  издержек: повторный ввод данных, поиск контрагента, ручные проверки,
  согласования, оформление и контроль.
questions:
  - key: participants
    type: table
    title: Участники рынка
    description: "Одна строка — одна устойчивая группа участников и её роль. Пример: «Сторона спроса — зрители — выбирают и потребляют контент»."
    required: true
    config:
      minRows: 1
      columns:
        - key: kind
          title: Тип участника
          type: select
          required: true
          options:
            - { value: demand, label: Сторона спроса }
            - { value: supply, label: Сторона предложения }
            - { value: intermediary, label: Посредник }
            - { value: government, label: Государство }
        - { key: name, title: Название, type: short_text, required: true }
        - { key: role, title: Роль, type: long_text, required: true }
  - key: macrotransactions
    type: table
    title: Макротранзакции
    description: "Опишите крупные устойчивые сценарии взаимодействия. Пример: «Создание и распространение видеоконтента: автор размещает произведение, платформа доставляет его зрителю»."
    required: true
    config:
      minRows: 1
      columns:
        - { key: name, title: Сценарий, type: short_text, required: true }
        - { key: description, title: Описание, type: long_text, required: true }
        - { key: participants, title: Участники, type: short_text, required: true }
  - key: microtransactions
    type: table
    title: Микротранзакции
    description: "Разложите каждый крупный сценарий на отдельные действия и оцените их. Пример: регистрация автора, проверка прав, загрузка контента, рекомендация зрителю и выплата вознаграждения."
    required: true
    config:
      minRows: 1
      columns:
        - { key: macro, title: Макротранзакция, type: short_text, required: true }
        - { key: name, title: Микротранзакция, type: short_text, required: true }
        - { key: frequency, title: Массовость, type: scale, min: 1, max: 4 }
        - { key: repeatability, title: Повторяемость, type: scale, min: 1, max: 5 }
        - { key: standardization, title: Стандартизированность, type: scale, min: 1, max: 5 }
        - { key: potential, title: Возможность платформизации, type: long_text }
  - key: target_2036
    type: long_text
    title: Какой должна стать модель транзакций к 2036 году?
    description: "Опишите, какие операции должны быть стандартизированы, автоматизированы или перенесены на платформы и насколько должны сократиться издержки."
    required: true
