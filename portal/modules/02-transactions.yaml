slug: transactions
version: 1
order: 2
title: Модель транзакций
description: Участники, сценарии взаимодействия и транзакционные издержки.
theory: |
  Транзакция — совокупность действий между сторонами спроса и предложения,
  направленных на обмен контентом, информацией, данными, услугами, денежными
  средствами, правами или другой ценностью (см. Глоссарий в меню справа).

  В разделе 1 вы определили границы отрасли и её рыночные сегменты. Теперь для
  этих сегментов нужно описать, **кто с кем взаимодействует**, **какую ценность
  передаёт** и **из каких действий складывается взаимодействие**.

  В портале рыночный сегмент и макротранзакция рассматриваются как разные
  уровни анализа. Один рыночный сегмент может включать несколько устойчивых
  сценариев взаимодействия, а одна макротранзакция может относиться к нескольким
  сегментам.

  Сначала выделите устойчивые группы участников: стороны спроса и предложения,
  посредников и государство. Затем опишите крупные устойчивые сценарии
  взаимодействия — **макротранзакции**. Например, создание и распространение
  видеоконтента или размещение и показ рекламы.

  После этого разложите каждый сценарий на последовательность конкретных
  действий — **микротранзакций**. К ним относятся поиск информации,
  идентификация, проверка требований, согласование, оформление документов,
  расчёты и контроль исполнения.

  Для каждой микротранзакции оцените массовость, повторяемость,
  стандартизированность и издержки. Это позволит определить действия, которые
  в первую очередь требуют унификации, цифровизации или переноса на платформы.
  Не стремитесь описать все исключения и технические операции: сосредоточьтесь
  на типовых участниках, ключевых сценариях и действиях, влияющих на результат.
questions:
  - key: participants
    order: 1
    type: table
    title: Участники отрасли
    description: "Добавьте только ключевые устойчивые группы участников. Не перечисляйте отдельные компании: например, «авторы контента», «зрители», «рекламодатели»."
    required: true
    config:
      minRows: 2
      maxRows: 20
      rowLabel: Участник
      addRowLabel: Добавить участника
      columns:
        - key: segments
          title: Сегменты
          description: "Выберите один или несколько сегментов из принятого раздела 1."
          type: multi_suggest
          contextKey: industrySegments
          allowCustom: false
          required: true
          fullWidth: true
          sortOptions: true
        - key: name
          title: Группа участников
          description: "Выберите из списка или впишите свой вариант."
          type: suggest
          allowCustom: true
          required: true
          fullWidth: true
          sortOptions: true
          contextKey: approvedParticipantGroups
          sourceQuestionKey: participants
          sourceColumnKey: name
          sourceLabelSuffix: (добавлено экспертом)
          uniqueAcrossRows: true
          options:
            - { value: Авторы и создатели контента, label: Авторы и создатели контента }
            - { value: Аудитория и пользователи, label: Аудитория и пользователи }
            - { value: Билетные операторы, label: Билетные операторы }
            - { value: Государственные органы и регуляторы, label: Государственные органы и регуляторы }
            - { value: Издатели и редакции СМИ, label: Издатели и редакции СМИ }
            - { value: Организаторы мероприятий, label: Организаторы мероприятий }
            - { value: Операторы связи и инфраструктуры, label: Операторы связи и инфраструктуры }
            - { value: Платёжные сервисы, label: Платёжные сервисы }
            - { value: Платформы и сервисы распространения, label: Платформы и сервисы распространения }
            - { value: Правообладатели, label: Правообладатели }
            - { value: Производители контента и студии, label: Производители контента и студии }
            - { value: Рекламные агентства и посредники, label: Рекламные агентства и посредники }
            - { value: Рекламодатели, label: Рекламодатели }
            - { value: Телеканалы и радиостанции, label: Телеканалы и радиостанции }
        - key: kind
          title: Типы участия в транзакциях
          description: "Выберите одну или несколько ролей, в которых эта группа обычно участвует в отраслевых транзакциях."
          type: multi_suggest
          allowCustom: false
          required: true
          fullWidth: true
          options:
            - { value: demand, label: Сторона спроса }
            - { value: supply, label: Сторона предложения }
            - { value: intermediary, label: Посредник }
            - { value: government, label: Государство }
        - key: role
          title: Описание участника в сегменте
          description: "Кратко укажите, что участник делает и какую ценность предоставляет или получает."
          type: long_text
          required: true
          fullWidth: true

  - key: macrotransactions
    order: 2
    type: table
    title: Сценарии взаимодействия (макротранзакции)
    description: "Опишите основные устойчивые сценарии. Один сценарий — одно завершённое взаимодействие с понятным результатом; редкие исключения можно не добавлять."
    required: true
    config:
      minRows: 1
      maxRows: 15
      rowLabel: Сценарий
      addRowLabel: Добавить сценарий
      columns:
        - key: segments
          title: Сегменты
          description: "Выберите один или несколько сегментов из принятого раздела 1."
          type: multi_suggest
          contextKey: industrySegments
          allowCustom: false
          required: true
          fullWidth: true
          sortOptions: true
        - key: name
          title: Название сценария
          description: "Сформулируйте как действие. Например: «Создание и распространение видеоконтента»."
          type: short_text
          required: true
          fullWidth: true
        - key: initiator
          title: Инициатор
          description: "Выбирается из перечня описанных групп участников выше."
          type: suggest
          allowCustom: false
          required: true
          sourceQuestionKey: participants
          sourceColumnKey: name
        - key: recipient
          title: Получатель
          description: "Выбирается из перечня описанных групп участников выше."
          type: suggest
          allowCustom: false
          required: true
          sourceQuestionKey: participants
          sourceColumnKey: name
        - key: value
          title: Предмет транзакции
          description: "Выберите один или несколько передаваемых видов ценности."
          type: multi_suggest
          allowCustom: false
          required: true
          fullWidth: true
          lastOptionValue: Другое
          sortOptions: true
          options:
            - { value: Контент или цифровой продукт, label: Контент или цифровой продукт }
            - { value: Информация и данные, label: Информация и данные }
            - { value: Внимание и охват аудитории, label: Внимание и охват аудитории }
            - { value: Рекламный инвентарь, label: Рекламный инвентарь }
            - { value: Услуга или выполненная работа, label: Услуга или выполненная работа }
            - { value: Денежные средства или вознаграждение, label: Денежные средства или вознаграждение }
            - { value: "Права, лицензия или разрешение", label: "Права, лицензия или разрешение" }
            - { value: "Доступ, подписка или билет", label: "Доступ, подписка или билет" }
            - { value: Инфраструктура или технологические ресурсы, label: Инфраструктура или технологические ресурсы }
            - { value: Другое, label: Другое }
        - key: customValue
          title: Укажите предмет транзакции (выбрано «Другое»)
          type: short_text
          requiredWhen: { columnKey: value, includes: Другое }
          visibleWhen: { columnKey: value, includes: Другое }
          fullWidth: true
        - key: transactionType
          title: Тип транзакции (см. Глоссарий)
          description: "Выберите тип по классификации, приведённой в Глоссарии."
          type: select
          required: true
          options:
            - { value: Сделка, label: Сделка }
            - { value: Управленческая, label: Управленческая }
            - { value: Рационирующая, label: Рационирующая }
        - key: description
          title: Суть и результат взаимодействия
          description: "Опишите, что происходит между участниками и чем завершается сценарий."
          type: long_text
          required: true
          fullWidth: true

  - key: microtransactions
    order: 3
    type: table
    title: Действия внутри сценария (микротранзакции)
    description: "Соберите цепочку значимых действий для каждого сценария. Для каждого сценария необходимо добавить хотя бы одно действие — перед отправкой система проверит это. Одна карточка — одно действие с самостоятельным результатом; технические клики и мелкие операции можно не выделять. Карточки можно переставлять внутри одного сценария."
    required: true
    config:
      minRows: 2
      maxRows: 40
      sortableRows: true
      groupByColumnKey: macro
      rowLabel: Действие
      addRowLabel: Добавить действие
      addRowRequiresColumnKey: result
      coverSourceQuestionKey: macrotransactions
      coverSourceColumns: [name]
      coverTargetColumns: [macro]
      coverageWarning: "Для каждого сценария добавьте хотя бы одно действие:"
      coverageError: "Добавьте хотя бы одно действие для каждого сценария"
      columns:
        - key: macro
          title: Сценарий
          type: suggest
          allowCustom: false
          required: true
          sourceQuestionKey: macrotransactions
          sourceColumnKey: name
          fullWidth: true
        - key: name
          title: Действие (микротранзакция)
          description: "Выберите из списка или впишите свой вариант."
          type: suggest
          allowCustom: true
          required: true
          fullWidth: true
          options:
            - { value: Поиск и сопоставление информации, label: Поиск и сопоставление информации }
            - { value: Агрегация и структурирование данных, label: Агрегация и структурирование данных }
            - { value: Идентификация и верификация, label: Идентификация и верификация }
            - { value: Проверка соответствия требованиям, label: Проверка соответствия требованиям }
            - { value: Оценка рисков, label: Оценка рисков }
            - { value: Согласование решения, label: Согласование решения }
            - { value: Оформление документов, label: Оформление документов }
            - { value: Проведение расчётов, label: Проведение расчётов }
            - { value: Мониторинг исполнения, label: Мониторинг исполнения }
        - key: actor
          title: Кто выполняет
          description: "Выбирается из перечня групп участников в пункте 1."
          type: suggest
          allowCustom: false
          required: true
          sourceQuestionKey: participants
          sourceColumnKey: name
        - key: result
          title: Описание и результат действия
          description: "Кратко опишите, что происходит и какой результат получается после выполнения действия."
          type: long_text
          required: true
          fullWidth: true
        - key: executionMode
          title: Как действие выполняется сейчас
          description: "Оцените текущую степень ручного выполнения и автоматизации действия."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Полностью вручную, label: Полностью вручную }
            - { value: Преимущественно вручную, label: Преимущественно вручную }
            - { value: Частично автоматизировано, label: Частично автоматизировано }
            - { value: Преимущественно автоматизировано, label: Преимущественно автоматизировано }
            - { value: Полностью автоматизировано, label: Полностью автоматизировано }

  - key: transaction_assessments
    order: 4
    type: table
    title: Оценка микротранзакций и транзакционных издержек
    description: "Карточки создаются автоматически из действий пункта 3. Дайте быструю экспертную оценку по единой шкале от «очень низкой» до «очень высокой»; точный расчёт не требуется."
    required: true
    config:
      minRows: 2
      maxRows: 40
      lockRows: true
      autoRowsFromQuestionKey: microtransactions
      autoRowMappings:
        - { sourceColumnKey: macro, targetColumnKey: macro }
        - { sourceColumnKey: name, targetColumnKey: micro }
        - { sourceColumnKey: actor, targetColumnKey: actor, identity: false }
        - { sourceColumnKey: executionMode, targetColumnKey: executionMode, identity: false }
      rowLabel: Оценка
      coverSourceQuestionKey: microtransactions
      coverSourceColumns: [macro, name]
      coverTargetColumns: [macro, micro]
      columns:
        - key: macro
          title: Сценарий
          type: readonly
          fullWidth: true
        - key: micro
          title: Действие
          type: readonly
          fullWidth: true
        - key: actor
          title: Исполнитель
          type: readonly
        - key: executionMode
          title: Как выполняется сейчас
          type: readonly
        - key: frequency
          title: Массовость
          description: "Масштаб распространения: сколько участников и операций охватывает действие."
          type: select
          required: true
          options:
            - { value: Очень низкая, label: Очень низкая }
            - { value: Низкая, label: Низкая }
            - { value: Средняя, label: Средняя }
            - { value: Высокая, label: Высокая }
            - { value: Очень высокая, label: Очень высокая }
        - key: repeatability
          title: Повторяемость
          description: "Насколько регулярно однотипное действие выполняется снова."
          type: select
          required: true
          options:
            - { value: Очень низкая, label: Очень низкая }
            - { value: Низкая, label: Низкая }
            - { value: Средняя, label: Средняя }
            - { value: Высокая, label: Высокая }
            - { value: Очень высокая, label: Очень высокая }
        - key: standardization
          title: Стандартизированность
          description: "Наличие единых правил, процедур, документов, данных и процессов."
          type: select
          required: true
          options:
            - { value: Очень низкая, label: Очень низкая }
            - { value: Низкая, label: Низкая }
            - { value: Средняя, label: Средняя }
            - { value: Высокая, label: Высокая }
            - { value: Очень высокая, label: Очень высокая }
        - key: resourceIntensity
          title: Ресурсоёмкость
          description: "Объём времени, труда и других ресурсов на одно выполнение действия."
          type: select
          required: true
          options:
            - { value: Очень низкая, label: Очень низкая }
            - { value: Низкая, label: Низкая }
            - { value: Средняя, label: Средняя }
            - { value: Высокая, label: Высокая }
            - { value: Очень высокая, label: Очень высокая }
        - key: costLevel
          title: Совокупный уровень издержек
          description: "Общий масштаб издержек с учётом массовости и затрат на одно выполнение."
          type: select
          required: true
          options:
            - { value: Очень низкий, label: Очень низкий }
            - { value: Низкий, label: Низкий }
            - { value: Средний, label: Средний }
            - { value: Высокий, label: Высокий }
            - { value: Очень высокий, label: Очень высокий }
        - key: costSources
          title: Основные источники издержек
          description: "Выберите одну или несколько причин, из-за которых действие требует лишнего времени, труда или денег."
          type: multi_suggest
          allowCustom: false
          required: true
          fullWidth: true
          sortOptions: true
          lastOptionValue: Другое
          options:
            - { value: Поиск и проверка информации или контрагента, label: Поиск и проверка информации или контрагента }
            - { value: "Сбор, повторный ввод и низкое качество данных", label: "Сбор, повторный ввод и низкое качество данных" }
            - { value: Несовместимость систем и отсутствие автоматического обмена данными, label: Несовместимость систем и отсутствие автоматического обмена данными }
            - { value: "Ручные проверки, модерация и контроль", label: "Ручные проверки, модерация и контроль" }
            - { value: Переговоры и многоэтапные согласования, label: Переговоры и многоэтапные согласования }
            - { value: Документооборот и договорное оформление, label: Документооборот и договорное оформление }
            - { value: "Подтверждение прав, получение лицензий или разрешений", label: "Подтверждение прав, получение лицензий или разрешений" }
            - { value: Сложность расчётов и проведения платежей, label: Сложность расчётов и проведения платежей }
            - { value: "Ошибки, исправления и повторное выполнение работ", label: "Ошибки, исправления и повторное выполнение работ" }
            - { value: Существенных издержек не выявлено, label: Существенных издержек не выявлено }
            - { value: Другое, label: Другое }
        - key: customCostSource
          title: Укажите источник издержек (выбрано «Другое»)
          type: short_text
          requiredWhen: { columnKey: costSources, includes: Другое }
          visibleWhen: { columnKey: costSources, includes: Другое }
          fullWidth: true
        - key: rationale
          title: Комментарий к оценке
          description: "Обязателен для высоких издержек, высокой ресурсоёмкости или низкой стандартизированности."
          type: long_text
          requiredWhenAny:
            - { columnKey: resourceIntensity, equals: Высокая }
            - { columnKey: resourceIntensity, equals: Очень высокая }
            - { columnKey: costLevel, equals: Высокий }
            - { columnKey: costLevel, equals: Очень высокий }
            - { columnKey: standardization, equals: Низкая }
            - { columnKey: standardization, equals: Очень низкая }
          fullWidth: true

  - key: transaction_materials
    order: 5
    type: file
    title: Подтверждающие материалы
    description: "Необязательно. Приложите схему, исследование, расчёт или другой материал, подтверждающий описание транзакций и издержек."
    config: {}
