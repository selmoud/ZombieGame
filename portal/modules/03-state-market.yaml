slug: state-market
version: 1
order: 3
title: Роль государства и рынка
description: Текущие и предлагаемые роли государства в платформенной модели.
theory: |
  В отрасли государство может одновременно выполнять несколько ролей:
  **регулятора**, **контрольно-надзорного органа**, **заказчика**, **оператора
  платформы или инфраструктуры** и **поставщика данных**. Для каждой роли важно
  описать не название ведомства, а конкретные функции и их влияние на
  транзакции.

  Оцените, насколько участие государства критично для возникновения,
  осуществления или завершения отраслевых транзакций. Подумайте, могут ли
  соответствующие функции выполнять рыночные участники либо оптимальна
  гибридная модель.

  Зафиксируйте ключевые форматы взаимодействия бизнеса с государством:
  лицензирование, отчётность, закупки, доступ к данным, подключение к
  инфраструктуре, контроль и другие механизмы.

  Итог анализа — вывод о том, помогает ли действующее распределение ролей
  возникновению и масштабированию платформ или, напротив, ограничивает их
  развитие, а также предложение по целевой модели взаимодействия.
questions:
  - key: state_roles
    type: table
    title: Роли государства
    description: "Одна строка — одна роль государства, её текущая функция и желаемое изменение. Пример: «Регулятор — устанавливает правила маркировки рекламы — требуется единый цифровой порядок»."
    required: true
    config:
      minRows: 1
      columns:
        - key: role
          title: Роль
          type: select
          required: true
          options:
            - { value: regulator, label: Регулятор }
            - { value: supervisor, label: Контрольно-надзорный орган }
            - { value: customer, label: Заказчик }
            - { value: operator, label: Оператор платформы }
            - { value: data_provider, label: Поставщик данных }
            - { value: other, label: Другое }
        - { key: function, title: Описание функции, type: long_text, required: true }
        - { key: efficiency, title: Эффективность 1–5, type: scale, min: 1, max: 5 }
        - { key: proposed_model, title: Предлагаемая модель, type: long_text }
  - key: market_role
    type: long_text
    title: Какую роль должен играть бизнес?
    description: "Опишите функции, которые эффективнее выполняют компании и отраслевые объединения. Пример: разработка стандартов обмена данными, саморегулирование или создание общей инфраструктуры."
    required: true
  - key: target_2036
    type: long_text
    title: Как должно измениться взаимодействие к 2036 году?
    description: "Предложите целевое распределение ответственности между государством, платформами и другими участниками с конкретными ожидаемыми результатами."
    required: true
