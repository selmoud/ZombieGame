            - { value: Производительность труда, label: Производительность труда }
            - { value: Размер аудитории, label: Размер аудитории }
            - { value: Активные пользователи (MAU), label: Активные пользователи (MAU) }
            - { value: Охват аудитории, label: Охват аудитории }
            - { value: Рекламные доходы, label: Рекламные доходы }
            - { value: Подписочная выручка, label: Подписочная выручка }
        - { key: value, title: Значение, type: short_text, required: true }
        - { key: period, title: Период, type: short_text }
        - { key: source, title: Источник, type: link }
