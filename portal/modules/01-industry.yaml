slug: industry
version: 1
order: 1
title: Текущее состояние отрасли
description: Границы, сегменты и динамика развития отрасли.
theory: |
  Этот раздел формирует общую точку отсчёта для дальнейшего анализа
  платформизации. Для отраслевой ретроспективы используется период
  2018–2026 годов: он позволяет учесть влияние пандемии COVID-19,
  последующих структурных изменений и актуального состояния отрасли.

  Сначала зафиксируйте **границы отрасли**: выберите смежные отрасли, с которыми
  пересекаются коммуникации, медиа и развлечения. Затем разложите отрасль
  на сегменты. Это позволит всем экспертам использовать одинаковый объект анализа.

  В этом разделе сегменты рассматриваются как устойчивые продуктовые и рыночные
  направления отрасли. Группы участников, их роли и сценарии взаимодействия
  будут подробно собраны в следующем модуле «Модель транзакций».

  Для каждого сегмента дайте экспертную оценку его относительного веса по
  пользовательской активности и экономическому вкладу. Используйте одинаковое
  основание для сравнения всех сегментов и кратко поясните логику оценки.
  Эти оценки задают фокус дальнейшей работы и не заменяют официальную статистику.

  Данные о **месте отрасли в экономике** формирует Минэкономразвития России,
  поэтому экспертам не требуется заполнять долю в ВВП, занятость,
  инвестиционную активность и другие макроэкономические показатели.

  Отдельно определите **ключевые показатели развития**, на которых следует
  сфокусироваться в последующих модулях. Каждый содержательный вывод по
  возможности подкрепляйте проверяемым источником или конкретным примером.

  В практической части важно описывать не отдельную компанию, а устойчивую
  ситуацию в отрасли или её сегменте. Конкретные компании и продукты можно
  приводить как подтверждающие примеры.
questions:
  - key: industry_boundaries
    order: 2
    type: table
    title: Сегменты отрасли
    description: "Добавьте рассматриваемые сегменты отрасли, укажите пересечения и оцените долю каждого сегмента. Одна карточка — один сегмент."
    required: true
    config:
      minRows: 1
      maxRows: 12
      rowLabel: Сегмент
      addRowLabel: Добавить сегмент
      columns:
        - key: industry
          title: Отрасль
          type: readonly
          defaultValue: Коммуникации, медиа и развлечения
          fullWidth: true
        - key: segment
          title: Сегмент
          type: suggest
          required: true
          allowCustom: false
          fullWidth: true
          lastOptionValue: Другое
          sortOptions: true
          sourceQuestionKey: industry_boundaries
          sourceColumnKey: customSegment
          sourceLabelSuffix: (добавлено пользователем)
          options:
            - { value: Мессенджеры и коммуникационные сервисы, label: Мессенджеры и коммуникационные сервисы }
            - { value: Социальные сети и сообщества, label: Социальные сети и сообщества }
            - { value: Авторский контент и блоговые платформы, label: Авторский контент и блоговые платформы }
            - { value: Онлайн-видео и видеосервисы, label: Онлайн-видео и видеосервисы }
            - { value: Телевидение и вещание, label: Телевидение и вещание }
            - { value: СМИ и цифровые издательские платформы, label: СМИ и цифровые издательские платформы }
            - { value: "Музыка, радио и аудиоконтент", label: "Музыка, радио и аудиоконтент" }
            - { value: Игры и интерактивные развлечения, label: Игры и интерактивные развлечения }
            - { value: Развлекательные мероприятия и билетные сервисы, label: Развлекательные мероприятия и билетные сервисы }
            - { value: "Реклама, продвижение и монетизация контента", label: "Реклама, продвижение и монетизация контента" }
            - { value: Другое, label: Другое }
        - key: customSegment
          title: Название сегмента
          type: short_text
          fullWidth: true
          visibleWhen: { columnKey: segment, equals: Другое }
          requiredWhen: { columnKey: segment, equals: Другое }
        - key: adjacentSegments
          title: Смежные сегменты (пересечения)
          type: multi_suggest
          fullWidth: true
          sortOptions: true
          optionsFromColumnKey: segment
          excludeColumnKey: segment
          excludeOptionValues: [Другое]
        - key: userActivityShare
          title: Экспертная оценка доли сегмента в отрасли с точки зрения пользовательской активности
          description: "Оцените долю сегмента по времени пользователей, охвату или частоте использования относительно всей отрасли."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: "Доминирующая — более 50%", label: "Доминирующая — более 50%" }
            - { value: "Крупная — 25–50%", label: "Крупная — 25–50%" }
            - { value: "Заметная — 10–25%", label: "Заметная — 10–25%" }
            - { value: "Небольшая — 5–10%", label: "Небольшая — 5–10%" }
            - { value: "Нишевая — менее 5%", label: "Нишевая — менее 5%" }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: economicShare
          title: Экспертная оценка экономической доли сегмента в отрасли
          description: "Оцените вклад сегмента по выручке, добавленной стоимости, инвестициям или объёму рынка относительно всей отрасли."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: "Доминирующая — более 50%", label: "Доминирующая — более 50%" }
            - { value: "Крупная — 25–50%", label: "Крупная — 25–50%" }
            - { value: "Заметная — 10–25%", label: "Заметная — 10–25%" }
            - { value: "Небольшая — 5–10%", label: "Небольшая — 5–10%" }
            - { value: "Нишевая — менее 5%", label: "Нишевая — менее 5%" }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: assessmentRationale
          title: Обоснование оценки
          description: "Объясните, на чём основаны оценки пользовательской активности и экономической доли сегмента. Укажите используемый показатель, экспертное наблюдение или логику сравнения и подкрепите вывод доступным источником либо конкретным примером."
          type: long_text
          required: true
          fullWidth: true
  - key: segment_assessment_file
    order: 5
    type: file
    title: Материалы к экспертной оценке отрасли и сегментов
    description: "Необязательно. Приложите расчёт, исследование или статистику, подтверждающие оценки отрасли, пользовательской активности и экономической доли сегментов."
    config: {}
  - key: analysis_object
    order: 1
    type: table
    title: Границы отрасли
    description: "Укажите отрасли, с которыми пересекаются коммуникации, медиа и развлечения."
    required: true
    config:
      minRows: 1
      maxRows: 1
      fixedRows: 1
      rowLabel: Параметры границ
      numberRows: false
      columns:
        - key: industry
          title: Отрасль
          type: readonly
          defaultValue: Коммуникации, медиа и развлечения
          fullWidth: true
        - key: adjacentIndustries
          title: Смежные отрасли (пересечения)
          type: multi_suggest
          required: true
          allowCustom: false
          fullWidth: true
          sortOptions: true
          options:
            - { value: Торговля, label: Торговля }
            - { value: Финансы, label: Финансы }
            - { value: Городская среда, label: Городская среда }
            - { value: Транспорт и логистика, label: Транспорт и логистика }
            - { value: Здравоохранение, label: Здравоохранение }
            - { value: Образование, label: Образование }
            - { value: Занятость, label: Занятость }
            - { value: Строительство и недвижимость, label: Строительство и недвижимость }
            - { value: Энергетика, label: Энергетика }
            - { value: Промышленность, label: Промышленность }
            - { value: Сельское хозяйство, label: Сельское хозяйство }
            - { value: Туризм, label: Туризм }
        - key: intersectionAssessment
          title: Экспертная оценка точек пересечения отраслей
          description: "Опишите, в чём именно проявляется пересечение с выбранными отраслями: какие продукты, услуги, данные, аудитории, инфраструктура или цепочки создания стоимости являются общими. Для каждой выбранной отрасли приведите не менее одного конкретного примера. Не повторяйте перечень отраслей — объясните механизм пересечения и его значение для коммуникаций, медиа и развлечений."
          type: long_text
          required: true
          fullWidth: true
  - key: current_state
    order: 3
    type: table
    title: Ретроспективная оценка развития отрасли в 2018–2026 годах
    description: "Разделите период 2018–2026 годов на значимые этапы и для каждого укажите ключевой фактор и характер его влияния на отрасль."
    required: true
    config:
      minRows: 1
      maxRows: 8
      rowLabel: Этап
      addRowLabel: Добавить этап
      columns:
        - key: startYear
          title: Начало этапа
          description: "Выберите первый год этапа."
          type: select
          required: true
          options:
            - { value: "2018", label: "2018" }
            - { value: "2019", label: "2019" }
            - { value: "2020", label: "2020" }
            - { value: "2021", label: "2021" }
            - { value: "2022", label: "2022" }
            - { value: "2023", label: "2023" }
            - { value: "2024", label: "2024" }
            - { value: "2025", label: "2025" }
            - { value: "2026", label: "2026" }
        - key: endYear
          title: Окончание этапа
          description: "Выберите последний год этапа."
          type: select
          required: true
          notBeforeColumnKey: startYear
          options:
            - { value: "2018", label: "2018" }
            - { value: "2019", label: "2019" }
            - { value: "2020", label: "2020" }
            - { value: "2021", label: "2021" }
            - { value: "2022", label: "2022" }
            - { value: "2023", label: "2023" }
            - { value: "2024", label: "2024" }
            - { value: "2025", label: "2025" }
            - { value: "2026", label: "2026" }
        - key: keyFactor
          title: Ключевой фактор, повлиявший на отрасль в указанный период
          description: "Выберите основной фактор этапа. Если подходящего варианта нет, выберите «Другое»."
          type: suggest
          required: true
          allowCustom: false
          fullWidth: true
          lastOptionValue: Другое
          sortOptions: true
          options:
            - { value: Пандемия COVID-19 и связанные ограничения, label: Пандемия COVID-19 и связанные ограничения }
            - { value: "Геополитические изменения, СВО и санкционное давление", label: "Геополитические изменения, СВО и санкционное давление" }
            - { value: Ускорение цифровизации и изменение поведения пользователей, label: Ускорение цифровизации и изменение поведения пользователей }
            - { value: Развитие российских цифровых платформ и импортозамещение, label: Развитие российских цифровых платформ и импортозамещение }
            - { value: Изменения государственного регулирования, label: Изменения государственного регулирования }
            - { value: "Технологические изменения: ИИ, алгоритмы и новые форматы", label: "Технологические изменения: ИИ, алгоритмы и новые форматы" }
            - { value: Изменение рекламного рынка и моделей монетизации, label: Изменение рекламного рынка и моделей монетизации }
            - { value: Изменение доходов населения и потребительского спроса, label: Изменение доходов населения и потребительского спроса }
            - { value: "Консолидация рынка и сделки M&A", label: "Консолидация рынка и сделки M&A" }
            - { value: Рост стоимости производства и инфраструктуры, label: Рост стоимости производства и инфраструктуры }
            - { value: Другое, label: Другое }
        - key: customFactor
          title: Название фактора
          description: "Кратко сформулируйте фактор, которого нет в списке."
          type: short_text
          fullWidth: true
          visibleWhen: { columnKey: keyFactor, equals: Другое }
          requiredWhen: { columnKey: keyFactor, equals: Другое }
        - key: influence
          title: Оценка влияния фактора на отрасль
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Негативное влияние, label: Негативное влияние }
            - { value: Нейтральное влияние, label: Нейтральное влияние }
            - { value: Позитивное влияние, label: Позитивное влияние }
        - key: influenceDescription
          title: Суть влияния
          description: "Своими словами опишите, что изменилось в отрасли под влиянием выбранного фактора."
          type: long_text
          required: true
          fullWidth: true
  - key: key_metrics
    order: 4
    type: table
    title: Ключевые показатели развития отрасли до 2036 года
    description: "Укажите 3–5 ключевых показателей, которые необходимо отслеживать в рамках развития отрасли. Расположите их по приоритету: наиболее значимый показатель — первым."
    required: true
    config:
      minRows: 3
      maxRows: 5
      rowLabel: Показатель
      addRowLabel: Добавить показатель
      sortableRows: true
      columns:
        - key: metric
          title: Показатель
          type: suggest
          required: true
          allowCustom: true
          fullWidth: true
          sortOptions: true
          options:
            - { value: Объём рынка и темпы его роста, label: Объём рынка и темпы его роста }
            - { value: Вклад в ВВП или ВДС, label: Вклад в ВВП или ВДС }
            - { value: Занятость и производительность труда, label: Занятость и производительность труда }
            - { value: Объём инвестиций, label: Объём инвестиций }
            - { value: Экспорт продукции и услуг отрасли, label: Экспорт продукции и услуг отрасли }
            - { value: Размер и динамика активной аудитории, label: Размер и динамика активной аудитории }
            - { value: Вовлечённость аудитории, label: Вовлечённость аудитории }
            - { value: Эффективность монетизации, label: Эффективность монетизации }
            - { value: Доля российских платформ и контента, label: Доля российских платформ и контента }
            - { value: Уровень технологического развития и цифровизации, label: Уровень технологического развития и цифровизации }
