slug: industry
version: 1
order: 1
title: Текущее состояние отрасли
description: Факты, показатели и ключевые участники отрасли сегодня.
theory: |
  Этот раздел формирует общую точку отсчёта для дальнейшего анализа
  платформизации. Текущее состояние рекомендуется оценивать в динамике за
  2022–2025 годы и, если данные доступны, с учётом первого полугодия 2026 года.

  Сначала определите **границы отрасли**: какие виды деятельности, продукты,
  услуги и участники входят в неё, а также где она пересекается со смежными
  отраслями. Это позволит всем экспертам использовать одинаковый объект анализа.

  Затем оцените **место отрасли в экономике**. Подойдут доля в ВВП или валовой
  добавленной стоимости, занятость, инвестиционная активность, производительность
  труда и другие показатели, значимые именно для вашей отрасли.

  Отдельно зафиксируйте **ключевые показатели развития**, действующие цели и
  задачи отрасли. Каждый вывод по возможности подкрепляйте числом, периодом
  измерения и проверяемым источником. Если количественных данных нет, обозначьте,
  что оценка является экспертной, и поясните её основание.

  В практической части важно описывать не отдельную компанию, а устойчивую
  ситуацию в отрасли или её сегменте. Конкретные компании и продукты можно
  приводить как подтверждающие примеры.
questions:
  - key: industry_boundaries
    type: table
    title: Границы отрасли
    description: "Добавьте рассматриваемые сегменты отрасли и выберите группы участников, работающих в каждом сегменте. Одна строка — один сегмент."
    required: true
    config:
      minRows: 1
      maxRows: 12
      columns:
        - key: industry
          title: Отрасль
          type: readonly
          defaultValue: Коммуникации, медиа и развлечения
          fullWidth: true
        - key: segment
          title: Сегмент
          type: suggest
          required: true
          allowCustom: false
          fullWidth: true
          lastOptionValue: Другое
          sortOptions: true
          sourceQuestionKey: industry_boundaries
          sourceColumnKey: customSegment
          sourceLabelSuffix: (добавлено пользователем)
          options:
            - { value: Мессенджеры и коммуникационные сервисы, label: Мессенджеры и коммуникационные сервисы }
            - { value: Социальные сети и сообщества, label: Социальные сети и сообщества }
            - { value: Авторский контент и блоговые платформы, label: Авторский контент и блоговые платформы }
            - { value: Онлайн-видео и видеосервисы, label: Онлайн-видео и видеосервисы }
            - { value: Телевидение и вещание, label: Телевидение и вещание }
            - { value: СМИ и цифровые издательские платформы, label: СМИ и цифровые издательские платформы }
            - { value: "Музыка, радио и аудиоконтент", label: "Музыка, радио и аудиоконтент" }
            - { value: Игры и интерактивные развлечения, label: Игры и интерактивные развлечения }
            - { value: Развлекательные мероприятия и билетные сервисы, label: Развлекательные мероприятия и билетные сервисы }
            - { value: "Реклама, продвижение и монетизация контента", label: "Реклама, продвижение и монетизация контента" }
            - { value: Другое, label: Другое }
        - key: customSegment
          title: Название сегмента
          type: short_text
          fullWidth: true
          visibleWhen: { columnKey: segment, equals: Другое }
          requiredWhen: { columnKey: segment, equals: Другое }
        - key: participants
          title: Участники
          type: multi_suggest
          required: true
          sortOptions: true
          options:
            - { value: Частные пользователи и аудитория, label: Частные пользователи и аудитория }
            - { value: Корпоративные пользователи и заказчики, label: Корпоративные пользователи и заказчики }
            - { value: Профессиональные сообщества, label: Профессиональные сообщества }
            - { value: "Авторы, блогеры и создатели контента", label: "Авторы, блогеры и создатели контента" }
            - { value: Журналисты и редакции, label: Журналисты и редакции }
            - { value: Продюсеры и производственные студии, label: Продюсеры и производственные студии }
            - { value: Правообладатели, label: Правообладатели }
            - { value: Издательства и медиахолдинги, label: Издательства и медиахолдинги }
            - { value: Музыкальные лейблы и исполнители, label: Музыкальные лейблы и исполнители }
            - { value: Разработчики и издатели игр, label: Разработчики и издатели игр }
            - { value: Организаторы мероприятий и площадки, label: Организаторы мероприятий и площадки }
            - { value: Цифровые платформы и сервисы, label: Цифровые платформы и сервисы }
            - { value: Социальные сети и мессенджеры, label: Социальные сети и мессенджеры }
            - { value: Видеохостинги и онлайн-кинотеатры, label: Видеохостинги и онлайн-кинотеатры }
            - { value: Телеканалы и радиовещатели, label: Телеканалы и радиовещатели }
            - { value: Агрегаторы и дистрибьюторы контента, label: Агрегаторы и дистрибьюторы контента }
            - { value: Билетные операторы, label: Билетные операторы }
            - { value: Рекламодатели, label: Рекламодатели }
            - { value: Рекламные агентства, label: Рекламные агентства }
            - { value: Рекламные и маркетинговые платформы, label: Рекламные и маркетинговые платформы }
            - { value: Сервисы аналитики и измерения аудитории, label: Сервисы аналитики и измерения аудитории }
            - { value: Платёжные сервисы, label: Платёжные сервисы }
            - { value: Операторы связи, label: Операторы связи }
            - { value: Облачные и технологические провайдеры, label: Облачные и технологические провайдеры }
            - { value: Владельцы ЦОД и CDN, label: Владельцы ЦОД и CDN }
            - { value: Магазины приложений и цифровые дистрибьюторы, label: Магазины приложений и цифровые дистрибьюторы }
            - { value: Органы государственной власти и регуляторы, label: Органы государственной власти и регуляторы }
            - { value: Государственные учреждения и заказчики, label: Государственные учреждения и заказчики }
            - { value: Отраслевые ассоциации, label: Отраслевые ассоциации }
            - { value: Саморегулируемые организации, label: Саморегулируемые организации }
  - key: analysis_object
    type: table
    title: Сегменты отрасли
    description: "Разделите отрасль на устойчивые сегменты. Одна строка — один сегмент. Пример: «Онлайн-видео — стриминговые сервисы и онлайн-кинотеатры — подписка и рекламная модель — платформы, правообладатели, зрители»."
    required: true
    config:
      minRows: 1
      maxRows: 12
      columns:
        - key: segment
          title: Сегмент
          type: suggest
          required: true
          options:
            - { value: Онлайн-видео, label: Онлайн-видео }
            - { value: Телевидение, label: Телевидение }
            - { value: Радио и подкасты, label: Радио и подкасты }
            - { value: Печатные и онлайн-СМИ, label: Печатные и онлайн-СМИ }
            - { value: Социальные сети, label: Социальные сети }
            - { value: Мессенджеры, label: Мессенджеры }
            - { value: Цифровая реклама, label: Цифровая реклама }
            - { value: Музыка и аудио, label: Музыка и аудио }
            - { value: Игры и киберспорт, label: Игры и киберспорт }
            - { value: Авторский контент, label: Авторский контент }
            - { value: Развлекательные мероприятия, label: Развлекательные мероприятия }
        - { key: scope, title: Что входит в сегмент, type: long_text, required: true }
        - { key: product, title: Ключевые продукты и услуги, type: short_text }
        - { key: company, title: Основные группы участников, type: short_text }
        - { key: intersection, title: Пересечения с другими сегментами, type: short_text }
  - key: current_state
    type: long_text
    title: Каково текущее состояние отрасли?
    description: "Опишите динамику за 2022–2025 годы, ключевых участников, продукты, процессы и значимые изменения. Пример: какие сегменты росли, сокращались или меняли модель работы."
    required: true
  - key: economic_role
    type: long_text
    title: Какое место отрасль занимает в экономике?
    description: "Приведите доступные данные о доле в ВВП или ВДС, занятости, инвестициях и производительности. Пример: «В отрасли занято около N человек, объём рынка составил N млрд рублей»."
    required: true
  - key: key_metrics
    type: table
    title: Ключевые показатели
    description: "Одна строка — один измеримый показатель с периодом и источником. Пример: «Объём рынка — 250 млрд руб. — 2025 — ссылка на исследование»."
    config:
      minRows: 0
      columns:
        - key: metric
          title: Показатель
          type: suggest
          required: true
          options:
            - { value: Объём рынка, label: Объём рынка }
            - { value: Вклад в ВВП или ВДС, label: Вклад в ВВП или ВДС }
            - { value: Численность занятых, label: Численность занятых }
            - { value: Объём инвестиций, label: Объём инвестиций }
            - { value: Производительность труда, label: Производительность труда }
            - { value: Размер аудитории, label: Размер аудитории }
            - { value: Активные пользователи (MAU), label: Активные пользователи (MAU) }
            - { value: Охват аудитории, label: Охват аудитории }
            - { value: Рекламные доходы, label: Рекламные доходы }
            - { value: Подписочная выручка, label: Подписочная выручка }
        - { key: value, title: Значение, type: short_text, required: true }
        - { key: period, title: Период, type: short_text }
        - { key: source, title: Источник, type: link }
  - key: development_goals
    type: long_text
    title: Какие цели и задачи развития отрасли актуальны сегодня?
    description: "Укажите действующие стратегические цели, программы и ожидаемые результаты. Пример: рост доли российского контента, повышение прозрачности измерений или расширение доступа к данным."
    required: true
  - key: systemic
    type: select
    title: Являются ли описанные проблемы системными для отрасли?
    description: "Выберите «Да», если проблема регулярно встречается у разных участников и не связана только с одной компанией."
    required: true
    config:
      options:
        - { value: yes, label: Да }
        - { value: no, label: Нет }
        - { value: unsure, label: Не могу оценить }
  - key: systemic_comment
    type: long_text
    title: Какие участники сталкиваются с аналогичной ситуацией?
    description: "Перечислите категории или примеры участников. Пример: региональные СМИ, независимые авторы, рекламные агентства и видеоплатформы."
  - key: target_2036
    type: long_text
    title: Как должна выглядеть ситуация к 2036 году?
    description: "Опишите желаемый измеримый результат. Пример: какие показатели вырастут, какие процессы станут цифровыми и какие проблемы будут устранены."
    required: true
  - key: supporting_file
    type: file
    title: Подтверждающие материалы
    description: "Приложите исследование, статистику, презентацию или расчёт, подтверждающие ответ. Допустимы PDF, DOCX, XLSX, PNG и JPG до 20 МБ."
    config: {}
