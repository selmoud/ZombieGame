slug: architecture
version: 1
order: 4
title: Архитектура взаимодействия
description: Доступ платформ к данным, внешних сервисов к платформам и участников к платформам.
theory: |
  В этом разделе оценивается **текущая архитектура платформенного
  взаимодействия** по трём направлениям: доступ платформ к данным, доступ
  внешних цифровых сервисов к платформам и доступ участников к платформам.
  Используйте платформы, участников и макротранзакции, уже принятые в
  предыдущих разделах.

  **Доступ платформ к данным** определяет, какие данные необходимы для
  отраслевых транзакций, кто ими владеет и на каких правовых, организационных
  и технических условиях платформы могут их использовать. Учитывайте
  открытость, качество, полноту, актуальность и стандартизацию данных.

  **Доступ внешних сервисов к платформам** показывает, могут ли независимые
  операторы подключать цифровые сервисы к платформенной инфраструктуре,
  использовать её возможности и создавать новые решения. Здесь важны
  механизмы интеграции, открытость, зрелость и надёжность сервисов.

  **Доступ участников к платформам** описывает условия подключения разных
  групп пользователей: физических лиц, бизнеса и государства. Учитывайте
  регистрацию, идентификацию, аккредитацию, интеграцию информационных систем,
  различия условий и ограничения доступа.

  Для каждого направления оцените, способствует ли существующая модель
  созданию новых сервисов, масштабированию платформ и формированию сетевых
  эффектов. Целевую архитектуру до 2036 года в этом разделе формировать не
  требуется — она будет собрана в итоговом разделе на основе всего анализа.
questions:
  - key: data_access
    order: 1
    type: table
    title: Доступ платформ к данным
    description: "Добавьте ключевые наборы или категории данных, от которых зависит работа платформ. Одна карточка — одна категория данных с едиными владельцем и условиями доступа."
    required: true
    config:
      minRows: 1
      maxRows: 15
      rowLabel: Категория данных
      addRowLabel: Добавить категорию данных
      columns:
        - key: platforms
          title: Платформы
          description: "Выберите одну или несколько платформ из принятого раздела 3, которым необходимы эти данные."
          type: multi_suggest
          contextKey: acceptedPlatforms
          allowCustom: false
          required: true
          fullWidth: true
          sortOptions: true
        - key: macros
          title: Связанные макротранзакции
          description: "Выберите сценарии из принятого раздела 2, для которых используются данные."
          type: multi_suggest
          contextKey: macroTransactions
          allowCustom: false
          required: true
          fullWidth: true
          sortOptions: true
        - key: data
          title: Категория или набор данных
          description: "Выберите из списка или впишите свой вариант."
          type: suggest
          allowCustom: true
          required: true
          fullWidth: true
          options:
            - { value: Данные о пользователях и профилях, label: Данные о пользователях и профилях }
            - { value: Данные о контенте и каталогах, label: Данные о контенте и каталогах }
            - { value: Данные о транзакциях и расчётах, label: Данные о транзакциях и расчётах }
            - { value: Данные об аудитории и пользовательском поведении, label: Данные об аудитории и пользовательском поведении }
            - { value: Данные о правах и лицензиях, label: Данные о правах и лицензиях }
            - { value: Рекламные данные и показатели кампаний, label: Рекламные данные и показатели кампаний }
            - { value: Государственные реестры и регуляторные данные, label: Государственные реестры и регуляторные данные }
            - { value: Справочники и классификаторы, label: Справочники и классификаторы }
        - key: owner
          title: Владелец или оператор данных
          description: "Выберите участника из принятых разделов или впишите организацию либо обобщённую группу."
          type: suggest
          contextKey: industryParticipants
          allowCustom: true
          required: true
          fullWidth: true
        - key: accessModel
          title: Текущая модель доступа
          description: "Выберите основной способ получения данных платформами."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Открытые данные, label: Открытые данные }
            - { value: Доступ по соглашению, label: Доступ по соглашению }
            - { value: Интеграция через информационную систему или API, label: Интеграция через информационную систему или API }
            - { value: Платный доступ, label: Платный доступ }
            - { value: Доступ только владельцу или ограниченному кругу участников, label: Доступ только владельцу или ограниченному кругу участников }
            - { value: Устойчивый доступ отсутствует, label: Устойчивый доступ отсутствует }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: quality
          title: Качество и стандартизация данных
          description: "Оцените полноту, актуальность, единообразие форматов и пригодность данных для автоматизированного использования."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Высокие, label: Высокие }
            - { value: Скорее высокие, label: Скорее высокие }
            - { value: Средние, label: Средние }
            - { value: Скорее низкие, label: Скорее низкие }
            - { value: Низкие, label: Низкие }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: restrictions
          title: Основные ограничения
          description: "Выберите из списка или впишите свои ограничения."
          type: multi_suggest
          allowCustom: true
          required: true
          fullWidth: true
          sortOptions: true
          options:
            - { value: Ограничения по персональным данным, label: Ограничения по персональным данным }
            - { value: Коммерческая тайна и конфиденциальность, label: Коммерческая тайна и конфиденциальность }
            - { value: Авторские и смежные права, label: Авторские и смежные права }
            - { value: Требования информационной безопасности, label: Требования информационной безопасности }
            - { value: Отсутствие единых форматов и классификаторов, label: Отсутствие единых форматов и классификаторов }
            - { value: Низкая полнота или актуальность данных, label: Низкая полнота или актуальность данных }
            - { value: Фрагментированное владение данными, label: Фрагментированное владение данными }
            - { value: Технические ограничения доступа, label: Технические ограничения доступа }
            - { value: Высокая стоимость доступа, label: Высокая стоимость доступа }
            - { value: Существенных ограничений не выявлено, label: Существенных ограничений не выявлено }
        - key: impact
          title: Влияние модели доступа на развитие платформ
          description: "Оцените, помогает ли текущая модель создавать сервисы, масштабировать платформы и усиливать сетевые эффекты."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Существенно ограничивает, label: Существенно ограничивает }
            - { value: Скорее ограничивает, label: Скорее ограничивает }
            - { value: Нейтрально, label: Нейтрально }
            - { value: Скорее способствует, label: Скорее способствует }
            - { value: Существенно способствует, label: Существенно способствует }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: rationale
          title: Обоснование оценки
          description: "Кратко поясните оценку: что именно помогает или мешает и к каким последствиям это приводит."
          type: long_text
          required: true
          fullWidth: true

  - key: service_access
    order: 2
    type: table
    title: Доступ внешних сервисов к платформам
    description: "Добавьте ключевые внешние цифровые сервисы или типы интеграций. Одна карточка — один сервис, подключённый или потенциально подключаемый к конкретным платформам."
    required: true
    config:
      minRows: 1
      maxRows: 12
      rowLabel: Внешний сервис
      addRowLabel: Добавить внешний сервис
      columns:
        - key: platforms
          title: Платформы
          description: "Выберите платформы из принятого раздела 3, с которыми взаимодействует сервис."
          type: multi_suggest
          contextKey: acceptedPlatforms
          allowCustom: false
          required: true
          fullWidth: true
          sortOptions: true
        - key: service
          title: Сервис или тип интеграции
          description: "Выберите из списка или впишите свой вариант."
          type: suggest
          allowCustom: true
          required: true
          fullWidth: true
          options:
            - { value: Идентификация и авторизация, label: Идентификация и авторизация }
            - { value: Платёжный сервис, label: Платёжный сервис }
            - { value: Аналитика и измерение аудитории, label: Аналитика и измерение аудитории }
            - { value: Рекламный сервис, label: Рекламный сервис }
            - { value: Модерация и проверка контента, label: Модерация и проверка контента }
            - { value: Управление правами и лицензиями, label: Управление правами и лицензиями }
            - { value: Облачная инфраструктура и доставка контента, label: Облачная инфраструктура и доставка контента }
            - { value: Интеграция с государственной информационной системой, label: Интеграция с государственной информационной системой }
        - key: operator
          title: Оператор сервиса
          description: "Выберите участника из принятых разделов или впишите организацию либо обобщённую группу."
          type: suggest
          contextKey: industryParticipants
          allowCustom: true
          required: true
          fullWidth: true
        - key: need
          title: Потребность, которую закрывает сервис
          description: "Кратко опишите, для кого и какую задачу решает сервис."
          type: long_text
          required: true
          fullWidth: true
        - key: integration
          title: Механизм подключения
          description: "Выберите из списка или впишите свой вариант."
          type: multi_suggest
          allowCustom: true
          required: true
          fullWidth: true
          sortOptions: true
          options:
            - { value: Открытый API, label: Открытый API }
            - { value: Партнёрский или закрытый API, label: Партнёрский или закрытый API }
            - { value: SDK или встраиваемый модуль, label: SDK или встраиваемый модуль }
            - { value: Обмен файлами или пакетная передача данных, label: Обмен файлами или пакетная передача данных }
            - { value: Интеграция по индивидуальному соглашению, label: Интеграция по индивидуальному соглашению }
            - { value: Ручное взаимодействие без технической интеграции, label: Ручное взаимодействие без технической интеграции }
            - { value: Подключение отсутствует, label: Подключение отсутствует }
        - key: openness
          title: Открытость платформы для подключения сервиса
          description: "Оцените доступность технических, организационных и правовых механизмов интеграции."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Открыта для подключения по единым правилам, label: Открыта для подключения по единым правилам }
            - { value: Доступна после проверки или аккредитации, label: Доступна после проверки или аккредитации }
            - { value: Доступна только отдельным партнёрам, label: Доступна только отдельным партнёрам }
            - { value: Практически закрыта для внешних сервисов, label: Практически закрыта для внешних сервисов }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: maturity
          title: Качество и зрелость сервиса
          description: "Оцените автоматизацию, удобство, надёжность и способность сервиса масштабироваться."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Высокие, label: Высокие }
            - { value: Скорее высокие, label: Скорее высокие }
            - { value: Средние, label: Средние }
            - { value: Скорее низкие, label: Скорее низкие }
            - { value: Низкие, label: Низкие }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: impact
          title: Влияние модели подключения на развитие платформ
          description: "Оцените влияние на создание новых сервисов, масштабирование платформ и сетевые эффекты."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Существенно ограничивает, label: Существенно ограничивает }
            - { value: Скорее ограничивает, label: Скорее ограничивает }
            - { value: Нейтрально, label: Нейтрально }
            - { value: Скорее способствует, label: Скорее способствует }
            - { value: Существенно способствует, label: Существенно способствует }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: rationale
          title: Обоснование оценки
          description: "Кратко поясните оценку и укажите основное условие или ограничение подключения."
          type: long_text
          required: true
          fullWidth: true

  - key: user_access
    order: 3
    type: table
    title: Доступ участников к платформам
    description: "Опишите основные модели подключения разных групп участников. Одна карточка — единая модель доступа одной или нескольких групп к конкретной платформе."
    required: true
    config:
      minRows: 1
      maxRows: 15
      rowLabel: Модель доступа
      addRowLabel: Добавить модель доступа
      columns:
        - key: platform
          title: Платформа
          description: "Выберите платформу из принятого раздела 3."
          type: suggest
          contextKey: acceptedPlatforms
          allowCustom: false
          required: true
          fullWidth: true
        - key: participants
          title: Группы участников
          description: "Выберите одну или несколько групп из принятого раздела 2."
          type: multi_suggest
          contextKey: participantGroups
          allowCustom: false
          required: true
          fullWidth: true
          sortOptions: true
        - key: interactionTypes
          title: Типы взаимодействия
          description: "Выберите подходящие форматы по составу участников."
          type: multi_suggest
          allowCustom: false
          required: true
          fullWidth: true
          options:
            - { value: B2C — бизнес и физические лица, label: B2C — бизнес и физические лица }
            - { value: B2B — бизнес и бизнес, label: B2B — бизнес и бизнес }
            - { value: B2G — бизнес и государство, label: B2G — бизнес и государство }
            - { value: G2C — государство и физические лица, label: G2C — государство и физические лица }
            - { value: G2B — государство и бизнес, label: G2B — государство и бизнес }
            - { value: G2G — государство и государство, label: G2G — государство и государство }
            - { value: C2C — физические лица и физические лица, label: C2C — физические лица и физические лица }
        - key: connection
          title: Механизмы подключения
          description: "Выберите из списка или впишите свой вариант."
          type: multi_suggest
          allowCustom: true
          required: true
          fullWidth: true
          sortOptions: true
          options:
            - { value: Самостоятельная регистрация, label: Самостоятельная регистрация }
            - { value: Идентификация или верификация, label: Идентификация или верификация }
            - { value: Аккредитация или проверка допуска, label: Аккредитация или проверка допуска }
            - { value: Заключение договора, label: Заключение договора }
            - { value: Интеграция информационной системы, label: Интеграция информационной системы }
            - { value: Подключение через посредника или партнёра, label: Подключение через посредника или партнёра }
            - { value: Подключение по приглашению, label: Подключение по приглашению }
        - key: openness
          title: Открытость платформы для участников
          description: "Оцените возможность подключения новых участников и единообразие условий доступа."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Открыта по единым правилам, label: Открыта по единым правилам }
            - { value: Доступна после стандартной проверки или аккредитации, label: Доступна после стандартной проверки или аккредитации }
            - { value: Условия различаются по группам участников, label: Условия различаются по группам участников }
            - { value: Доступ существенно ограничен, label: Доступ существенно ограничен }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: restrictions
          title: Основные ограничения доступа
          description: "Выберите из списка или впишите свои ограничения."
          type: multi_suggest
          allowCustom: true
          required: true
          fullWidth: true
          sortOptions: true
          options:
            - { value: Сложная регистрация или идентификация, label: Сложная регистрация или идентификация }
            - { value: Длительная проверка или аккредитация, label: Длительная проверка или аккредитация }
            - { value: Высокая стоимость подключения или использования, label: Высокая стоимость подключения или использования }
            - { value: Неравные условия для разных групп участников, label: Неравные условия для разных групп участников }
            - { value: Территориальные ограничения, label: Территориальные ограничения }
            - { value: Технологические требования к участнику, label: Технологические требования к участнику }
            - { value: Недостаточная доступность интерфейсов, label: Недостаточная доступность интерфейсов }
            - { value: Ограничения по возрасту или правовому статусу, label: Ограничения по возрасту или правовому статусу }
            - { value: Существенных ограничений не выявлено, label: Существенных ограничений не выявлено }
        - key: impact
          title: Влияние модели доступа на развитие платформ
          description: "Оцените влияние на подключение новых участников, масштабирование и сетевые эффекты."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Существенно ограничивает, label: Существенно ограничивает }
            - { value: Скорее ограничивает, label: Скорее ограничивает }
            - { value: Нейтрально, label: Нейтрально }
            - { value: Скорее способствует, label: Скорее способствует }
            - { value: Существенно способствует, label: Существенно способствует }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: rationale
          title: Обоснование оценки
          description: "Кратко поясните, что помогает или мешает подключению участников и к каким последствиям это приводит."
          type: long_text
          required: true
          fullWidth: true

  - key: architecture_materials
    order: 4
    type: file
    title: Подтверждающие материалы
    description: "Необязательно. Приложите схему интеграции, описание API, стандарт данных, исследование или иной материал по архитектуре взаимодействия."
    config: {}
