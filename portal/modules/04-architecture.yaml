slug: architecture
version: 1
order: 4
title: Архитектура взаимодействия
description: Доступ платформ к данным, внешних сервисов к платформам и пользователей к услугам.
theory: |
  Архитектура платформенного взаимодействия рассматривается по трём
  направлениям: **доступ платформ к данным**, **доступ внешних сервисов к
  платформам** и **доступ пользователей к платформам**.

  Для данных укажите необходимые наборы, их владельцев и операторов, правовые
  основания, качество, периодичность обновления и технический способ передачи.
  Отдельно отметьте ограничения, связанные с персональными данными,
  коммерческой тайной и информационной безопасностью.

  Для внешних сервисов опишите интерфейсы интеграции: API, стандарты обмена,
  требования к подключению, идентификации, тарификации и контролю качества.
  Оцените, обеспечивают ли действующие правила совместимость систем и равный
  доступ участников.

  Для пользователей учитывайте разные категории и условия подключения:
  идентификацию, доступность интерфейсов, стоимость, территориальные и
  технологические ограничения. Целевая архитектура должна поддерживать
  безопасное, доверенное и недискриминационное взаимодействие.
questions:
  - key: data_access
    type: table
    title: Доступ платформ к данным
    description: "Одна строка — один необходимый набор данных. Пример: «Данные об аудитории — владелец измеритель — доступ через API по единым правилам и с соблюдением требований к персональным данным»."
    required: true
    config:
      minRows: 1
      columns:
        - { key: data, title: Какие данные нужны, type: long_text, required: true }
        - { key: owner, title: Владелец, type: short_text, required: true }
        - { key: terms, title: Условия доступа, type: long_text }
        - { key: limits, title: Ограничения, type: long_text }
  - key: service_access
    type: table
    title: Доступ внешних сервисов к платформам
    description: "Укажите необходимые интеграции и условия подключения. Пример: API рекламного кабинета, открытая документация, единая авторизация и лимиты запросов."
    required: true
    config:
      minRows: 1
      columns:
        - { key: api, title: API или интеграция, type: short_text, required: true }
        - { key: openness, title: Уровень открытости, type: long_text }
        - { key: limits, title: Ограничения, type: long_text }
  - key: user_access
    type: table
    title: Доступ пользователей
    description: "Опишите отдельные категории пользователей и их путь подключения. Пример: независимый автор регистрируется дистанционно, подтверждает личность и принимает стандартные условия."
    required: true
    config:
      minRows: 1
      columns:
        - { key: category, title: Категория, type: short_text, required: true }
        - { key: connection, title: Механизм подключения, type: long_text }
        - { key: limits, title: Ограничения, type: long_text }
  - key: target_2036
    type: long_text
    title: Как должна выглядеть архитектура к 2036 году?
    description: "Опишите целевую схему обмена данными и подключения сервисов и пользователей: стандарты, интерфейсы, ответственность и требования безопасности."
    required: true
