slug: international
version: 1
order: 7
title: Международная экспансия
description: Текущее присутствие и условия выхода российских платформ на внешние рынки.
theory: |
  Международная экспансия — способность российской платформы привлекать и
  удерживать иностранных пользователей, поддерживая глубину и частоту их
  взаимодействия.

  Возможны два основных канала: работа платформы на зарубежных рынках и
  привлечение иностранных пользователей на российскую платформу внутри страны,
  например через медицинский туризм или обучение.

  Сначала зафиксируйте фактическое присутствие и юрисдикции, затем оцените
  потенциал расширения. Для количественной оценки можно использовать число
  активных пользователей (MAU), объём проходящих через платформу транзакций
  (GTV) и другие отраслевые показатели.

  Опишите условия масштабирования: локализацию, регулирование, платёжную и
  логистическую инфраструктуру, партнёрства, доступ к данным, продвижение и
  необходимую государственную поддержку.
questions:
  - key: platforms
    type: table
    title: Международное присутствие платформ
    description: "Одна строка — одна российская платформа. Укажите страны текущего присутствия и оцените потенциал. Пример: «Платформа X — Казахстан и Беларусь — высокий потенциал выхода в страны СНГ»."
    required: true
    config:
      minRows: 1
      columns:
        - { key: platform, title: Платформа, type: short_text, required: true }
        - key: presence
          title: Есть зарубежное присутствие
          type: select
          required: true
          options:
            - { value: yes, label: Да }
            - { value: no, label: Нет }
        - key: countries
          title: Страны
          type: multi_suggest
          options:
            - { value: Армения, label: Армения }
            - { value: Азербайджан, label: Азербайджан }
            - { value: Беларусь, label: Беларусь }
            - { value: Грузия, label: Грузия }
            - { value: Казахстан, label: Казахстан }
            - { value: Кыргызстан, label: Кыргызстан }
            - { value: Молдова, label: Молдова }
            - { value: Таджикистан, label: Таджикистан }
            - { value: Узбекистан, label: Узбекистан }
            - { value: Туркменистан, label: Туркменистан }
            - { value: Китай, label: Китай }
            - { value: Индия, label: Индия }
            - { value: Индонезия, label: Индонезия }
            - { value: Вьетнам, label: Вьетнам }
            - { value: ОАЭ, label: ОАЭ }
            - { value: Саудовская Аравия, label: Саудовская Аравия }
            - { value: Турция, label: Турция }
            - { value: Сербия, label: Сербия }
            - { value: Бразилия, label: Бразилия }
            - { value: ЮАР, label: ЮАР }
        - key: potential
          title: Потенциал
          type: select
          options:
            - { value: very_high, label: Очень высокий }
            - { value: high, label: Высокий }
            - { value: medium, label: Средний }
            - { value: low, label: Низкий }
        - { key: needs, title: Что необходимо для выхода, type: long_text }
  - key: state_support
    type: long_text
    title: Какая поддержка государства необходима?
    description: "Предложите конкретные инструменты. Пример: межгосударственное признание электронной идентификации, экспортное финансирование или помощь в локализации."
  - key: target_2036
    type: long_text
    title: Какой результат должен быть достигнут к 2036 году?
    description: "Укажите целевые рынки и измеримые показатели: число стран, зарубежных активных пользователей, объём транзакций или долю экспортной выручки."
    required: true
