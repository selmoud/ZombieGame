slug: international
version: 1
order: 7
title: Международная экспансия
description: Текущее международное присутствие и потенциал российских платформ.
theory: |
  Международная экспансия — способность российской платформы привлекать,
  поддерживать глубину и частоту взаимодействия и удерживать иностранных
  пользователей.

  Методика выделяет два основных канала экспансии. Первый — привлечение
  иностранных пользователей на российскую платформу **на зарубежных рынках**.
  Второй — привлечение иностранных пользователей **на российском рынке**,
  например через обучение, туризм, культурные продукты или другие
  трансграничные сценарии.

  Факт зарубежной доступности сайта или приложения сам по себе не означает
  устойчивого присутствия. Учитывайте наличие активных иностранных
  пользователей, локализованного предложения, партнёров, регулярных
  транзакций и механизмов удержания аудитории.

  Для количественной оценки при наличии данных можно использовать число
  активных иностранных пользователей (MAU или аналогичный показатель), объём
  их транзакций (GTV или аналогичный показатель), экспортную выручку и другие
  отраслевые метрики.

  Потенциал оценивается отдельно от текущего присутствия. Платформа может пока
  не работать за рубежом, но обладать высоким потенциалом, либо присутствовать
  в нескольких странах без условий для дальнейшего масштабирования. Обоснуйте
  оценку через ценность продукта, ограничения и необходимые условия.

  Целевые показатели до 2036 года здесь не задаются. Они будут сформированы в
  итоговом разделе после сопоставления потенциала, барьеров и эффектов.
