slug: target-state
version: 1
order: 8
title: Выводы и рекомендации
description: Консолидированные предложения и целевая модель отрасли к 2036 году.
theory: |
  Итоговый раздел объединяет результаты анализа разделов 1–7 и описывает
  желаемую модель платформизации отрасли на горизонте 2036 года.

  Целевое состояние должно раскрывать четыре элемента: модель организации
  отраслевых транзакций через платформы, распределение ролей государства и
  рынка, архитектуру доступа к данным и сервисам, а также приоритетные
  направления с ожидаемыми социально-экономическими эффектами.

  Укажите, какие участники и транзакции должны быть переведены на платформы,
  что необходимо стандартизировать и насколько должны сократиться
  транзакционные издержки. При высокой неопределённости допустимо представить
  несколько сценариев.

  Рекомендации должны быть практическими: конкретное изменение, адресат,
  механизм реализации, ожидаемый измеримый результат, срок и риски. Отдельно
  можно зафиксировать вопросы, по которым у экспертов сохраняются разногласия,
  с аргументами сторон и возможными способами их разрешения.
questions:
  - key: proposals
    type: table
    title: Стратегические предложения
    description: "Одна строка — одно практическое предложение: текущее состояние, целевой результат, необходимые изменения и ответственные. Пример: внедрение единого отраслевого стандарта данных к определённому сроку."
    required: true
    config:
      minRows: 1
      columns:
        - { key: direction, title: Ключевое направление, type: short_text, required: true }
        - { key: current, title: Текущее состояние, type: long_text, required: true }
        - { key: target, title: Целевое состояние 2036, type: long_text, required: true }
        - { key: changes, title: Необходимые изменения, type: long_text, required: true }
        - { key: owners, title: Ответственные участники, type: short_text }
        - { key: effect, title: Ожидаемый эффект, type: long_text, required: true }
        - { key: risks, title: Риски, type: long_text }
  - key: priorities
    type: long_text
    title: Какие три меры следует начать в первую очередь?
    description: "Перечислите ровно три первоочередные меры в порядке приоритета и кратко объясните выбор. Для каждой укажите первый шаг, ответственного и ожидаемый эффект."
    required: true
