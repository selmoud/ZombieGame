slug: target-state
version: 1
order: 8
title: Выводы и рекомендации
description: Целевая модель платформизации отрасли и практические рекомендации до 2036 года.
theory: |
  Итоговый раздел объединяет результаты анализа разделов 1–7 и формирует
  желаемую модель платформизации отрасли на горизонте 2036 года. Здесь не нужно
  повторять ранее введённые сведения: используйте принятые транзакции,
  платформы, барьеры, эффекты и оценки международного потенциала как основание
  для выводов.

  **Целевая модель транзакций** должна показать, какие макротранзакции и их
  элементы целесообразно перевести на платформы, что требуется дополнительно
  стандартизировать и какого сокращения транзакционных издержек можно ожидать.

  **Целевая модель государства и рынка** определяет желаемое распределение
  ролей и функций между государственными и рыночными участниками.

  **Целевая архитектура** описывает будущие условия доступа платформ к данным,
  внешних сервисов к платформам и участников к платформам.

  **Международное развитие** фиксирует желаемое положение российских платформ
  и реалистичные условия расширения их иностранной аудитории.

  Рекомендация должна содержать конкретное изменение, механизм реализации,
  участников, первый шаг, срок и проверяемый результат. Мероприятие и эффект —
  не одно и то же: создание стандарта является действием, а сокращение времени
  и издержек взаимодействия — результатом.

  Если по отдельному вопросу существуют обоснованные альтернативные позиции,
  не нужно искусственно сводить их к единому мнению. Зафиксируйте предмет
  разногласия, аргументы и возможный способ разрешения.
questions:
  - key: target_transactions
    order: 1
    type: table
    title: Целевая модель отраслевых транзакций
    description: "Строки создаются из макротранзакций раздела 2. Для каждой укажите желаемый уровень платформизации к 2036 году, потребность в стандартизации и ожидаемое сокращение транзакционных издержек."
    required: true
    config:
      minRows: 1
      maxRows: 15
      lockRows: true
      rowLabel: Макротранзакция
      columns:
        - key: macro
          title: Макротранзакция
          type: readonly
          required: true
          fullWidth: true
        - key: currentShare
          title: Принятая оценка текущего проникновения платформ
          type: readonly
          required: true
          fullWidth: true
        - key: targetShare
          title: Целевая доля транзакций через платформы к 2036 году
          description: "Выберите реалистичный диапазон с учётом специфики транзакции."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: "Менее 5%", label: "Менее 5%" }
            - { value: "5–15%", label: "5–15%" }
            - { value: "15–30%", label: "15–30%" }
            - { value: "30–50%", label: "30–50%" }
            - { value: "Более 50%", label: "Более 50%" }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: standardization
          title: Необходимость дополнительной стандартизации
          description: "Оцените, насколько требуется унифицировать правила, данные, документы или действия внутри транзакции."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Дополнительная стандартизация не требуется, label: Дополнительная стандартизация не требуется }
            - { value: Требуется стандартизация отдельных элементов, label: Требуется стандартизация отдельных элементов }
            - { value: Требуется существенная стандартизация процесса, label: Требуется существенная стандартизация процесса }
            - { value: Требуется перепроектирование транзакции перед переводом на платформу, label: Требуется перепроектирование транзакции перед переводом на платформу }
            - { value: Транзакция плохо поддаётся стандартизации, label: Транзакция плохо поддаётся стандартизации }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: costReduction
          title: Ожидаемое сокращение транзакционных издержек
          description: "Используйте диапазон как экспертную целевую оценку. Не выдавайте предположение за рассчитанное значение."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Более 50%, label: Более 50% }
            - { value: "25–50%", label: "25–50%" }
            - { value: "10–25%", label: "10–25%" }
            - { value: Менее 10%, label: Менее 10% }
            - { value: Существенного сокращения не ожидается, label: Существенного сокращения не ожидается }
            - { value: Затрудняюсь оценить, label: Затрудняюсь оценить }
        - key: targetDescription
          title: Обоснование целевой модели
          description: "Опишите, какие действия должны проходить через платформы, что останется вне платформенного контура и почему выбран такой уровень."
          type: long_text
          required: true
          fullWidth: true

  - key: target_model
    order: 2
    type: table
    title: Целевая модель платформенного взаимодействия
    description: "Три строки соответствуют обязательным элементам итоговой модели. Сформулируйте желаемое состояние, критерий достижения и основные условия."
    required: true
    config:
      minRows: 3
      maxRows: 3
      lockRows: true
      rowLabel: Элемент модели
      columns:
        - key: dimension
          title: Элемент целевой модели
          type: readonly
          required: true
          fullWidth: true
        - key: targetState
          title: Целевое состояние к 2036 году
          description: "Опишите желаемую устойчивую модель, а не отдельное мероприятие."
          type: long_text
          required: true
          fullWidth: true
        - key: linkedBarriers
          title: Связанные барьеры
          description: "Выберите барьеры из принятого раздела 5, которые необходимо снять для достижения целевого состояния."
          type: multi_suggest
          contextKey: acceptedBarriers
          allowCustom: false
          required: true
          fullWidth: true
          sortOptions: true
        - key: linkedEffects
          title: Ожидаемые эффекты
          description: "Выберите эффекты из принятого раздела 6, которые должна обеспечить целевая модель."
          type: multi_suggest
          contextKey: acceptedEffects
          allowCustom: false
          required: true
          fullWidth: true
          sortOptions: true
        - key: successCriteria
          title: Критерий достижения
          description: "Укажите проверяемый признак или показатель, по которому можно оценить достижение целевого состояния."
          type: long_text
          required: true
          fullWidth: true
        - key: assumptions
          title: Ключевые условия и риски
          description: "Укажите условия, без которых модель не реализуется, и основные риски."
          type: long_text
          required: true
          fullWidth: true

  - key: recommendations
    order: 3
    type: table
    title: Практические рекомендации
    description: "Добавьте 3–10 рекомендаций и расположите их по приоритету. Одна карточка — одно конкретное изменение с механизмом, участниками и проверяемым результатом."
    required: true
    config:
      minRows: 3
      maxRows: 10
      sortableRows: true
      numberRows: true
      rowLabel: Рекомендация
      addRowLabel: Добавить рекомендацию
      columns:
        - key: direction
          title: Направление
          description: "Выберите элемент целевой модели, к которому относится рекомендация."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: Транзакции и стандартизация, label: Транзакции и стандартизация }
            - { value: Роли государства и рынка, label: Роли государства и рынка }
            - { value: Данные и архитектура взаимодействия, label: Данные и архитектура взаимодействия }
            - { value: Снятие барьеров и развитие платформ, label: Снятие барьеров и развитие платформ }
            - { value: Международная экспансия, label: Международная экспансия }
        - key: title
          title: Название рекомендации
          description: "Сформулируйте кратко как конкретное изменение."
          type: short_text
          required: true
          uniqueAcrossRows: true
          fullWidth: true
        - key: barriers
          title: Какие барьеры снимает рекомендация
          description: "Выберите один или несколько барьеров из принятого раздела 5."
          type: multi_suggest
          contextKey: acceptedBarriers
          allowCustom: false
          required: true
          fullWidth: true
          sortOptions: true
        - key: action
          title: Содержание и механизм реализации
          description: "Опишите, что именно нужно изменить и каким способом это может быть реализовано."
          type: long_text
          required: true
          fullWidth: true
        - key: responsible
          title: Участники реализации
          description: "Выберите из списка или впишите участников, необходимых для реализации."
          type: multi_suggest
          contextKey: industryParticipants
          allowCustom: true
          required: true
          fullWidth: true
          sortOptions: true
          options:
            - { value: Федеральные органы государственной власти, label: Федеральные органы государственной власти }
            - { value: Региональные органы государственной власти, label: Региональные органы государственной власти }
            - { value: Операторы платформ, label: Операторы платформ }
            - { value: Отраслевые объединения, label: Отраслевые объединения }
            - { value: Владельцы и операторы данных, label: Владельцы и операторы данных }
            - { value: Технологические компании, label: Технологические компании }
            - { value: Образовательные и научные организации, label: Образовательные и научные организации }
        - key: firstStep
          title: Первый практический шаг
          description: "Укажите действие, с которого можно начать реализацию рекомендации."
          type: long_text
          required: true
          fullWidth: true
        - key: horizon
          title: Горизонт реализации
          description: "Выберите период, к которому должен быть получен основной результат."
          type: select
          required: true
          fullWidth: true
          options:
            - { value: "2026–2028", label: "2026–2028" }
            - { value: "2029–2032", label: "2029–2032" }
            - { value: "2033–2036", label: "2033–2036" }
        - key: effects
          title: Ожидаемые эффекты
          description: "Выберите эффекты из принятого раздела 6."
          type: multi_suggest
          contextKey: acceptedEffects
          allowCustom: false
          required: true
          fullWidth: true
          sortOptions: true
        - key: expectedResult
          title: Проверяемый результат
          description: "Укажите конкретное изменение или показатель, подтверждающий выполнение рекомендации."
          type: long_text
          required: true
          fullWidth: true
        - key: risks
          title: Риски реализации
          description: "Необязательно. Укажите основные риски и возможные нежелательные последствия."
          type: long_text
          fullWidth: true

  - key: disagreements
    order: 4
    type: table
    title: Вопросы, по которым сохраняются разногласия
    description: "Необязательно. Добавляйте только содержательные разногласия, влияющие на выводы или рекомендации."
    config:
      minRows: 0
      maxRows: 10
      rowLabel: Вопрос
      addRowLabel: Добавить разногласие
      columns:
        - key: issue
          title: Предмет разногласия
          description: "Кратко сформулируйте вопрос, по которому нет единой позиции."
          type: short_text
          required: true
          fullWidth: true
        - key: positions
          title: Альтернативные позиции
          description: "Опишите позиции сторон без выбора «правильной» версии."
          type: long_text
          required: true
          fullWidth: true
        - key: arguments
          title: Основные аргументы
          description: "Приведите ключевые основания каждой позиции."
          type: long_text
          required: true
          fullWidth: true
        - key: resolution
          title: Возможный способ разрешения
          description: "Укажите, какие данные, обсуждение или решение помогут снять разногласие."
          type: long_text
          required: true
          fullWidth: true

  - key: final_materials
    order: 5
    type: file
    title: Подтверждающие материалы
    description: "Необязательно. Приложите расчёт, дорожную карту, проект стандарта или иной материал к итоговым рекомендациям."
    config: {}
